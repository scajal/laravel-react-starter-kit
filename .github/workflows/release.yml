name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${TAG#v}" '/^## \[/ { if (found) exit; found = index($0, "[" version "]") } /^\[[^]]+\]: / { if (found) exit } found' CHANGELOG.md | tail -n +2 > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}. Add a '## [${TAG#v}]' section before tagging."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""

          if [[ "$TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi

          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag $prerelease
